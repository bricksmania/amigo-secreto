<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar amigo secreto</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    textarea { width: 100%; min-height: 140px; font: inherit; box-sizing: border-box; }
    input { width: 100%; font: inherit; padding: .4rem; box-sizing: border-box; }
    label { display: block; margin-bottom: 1rem; }
    button { padding: .6rem 1.2rem; font: inherit; cursor: pointer; }
    .erro { color: #b00020; }
    .box { background: #f4f4f4; padding: 1rem; border-radius: 8px; word-break: break-all; margin-top: 1rem; }
    small { color: #555; }
  </style>
</head>
<body>
  <h1>Criar amigo secreto</h1>

  <h2>Meus sorteios (neste aparelho)</h2>
  <div id="meus"></div>

  <form id="form">
    <label>
      Nome do sorteio (obrigatório, para você identificar depois)
      <input id="titulo" placeholder="Ex.: Amigo oculto 1" required>
    </label>

    <label>
      Participantes (um por linha): <code>Nome : Dependente1, Dependente2</code>
      <small>Ex.: Arlete : Joao, Maria</small>
      <textarea id="pessoas" placeholder="Arlete : Joao, Maria&#10;Carlos&#10;Ana"></textarea>
    </label>

    <label>
      Exclusões (um par por linha; os dois não se tiram).
      <small>Ex.: Carlos - Ana</small>
      <textarea id="proibidos" placeholder="Carlos - Ana"></textarea>
    </label>

    <button type="submit">Criar sorteio</button>
  </form>

  <div id="resultado"></div>

  <script>
    const linhas = (t) => t.split('\n').map((l) => l.trim()).filter(Boolean);

    // Lista dos sorteios criados neste aparelho (fica só no navegador, não no servidor).
    const CHAVE = 'amigo-secreto-sorteios';
    function lerLocal() {
      try { return JSON.parse(localStorage.getItem(CHAVE)) || []; } catch (e) { return []; }
    }
    function gravarLocal(lista) {
      localStorage.setItem(CHAVE, JSON.stringify(lista));
    }
    function desenharLista() {
      const area = document.getElementById('meus');
      const lista = lerLocal();
      area.textContent = '';
      if (lista.length === 0) {
        area.textContent = 'Nenhum sorteio criado neste aparelho ainda.';
        return;
      }
      for (const item of lista) {
        const linha = document.createElement('div');
        linha.className = 'box';
        const a = document.createElement('a');
        a.href = item.link;
        a.textContent = item.titulo;
        const data = document.createElement('small');
        data.textContent = ' — ' + new Date(item.criado).toLocaleString('pt-BR');
        const remover = document.createElement('button');
        remover.type = 'button';
        remover.textContent = 'Tirar da lista';
        remover.style.marginLeft = '.5rem';
        remover.addEventListener('click', () => {
          gravarLocal(lerLocal().filter((x) => x.link !== item.link));
          desenharLista();
        });
        linha.append(a, data, remover);
        area.append(linha);
      }
    }
    desenharLista();

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const saida = document.getElementById('resultado');
      if (!document.getElementById('titulo').value.trim()) {
        saida.className = 'erro';
        saida.textContent = 'Dê um nome para o sorteio.';
        return;
      }
      saida.textContent = 'Criando...';
      saida.className = '';

      const pessoas = linhas(document.getElementById('pessoas').value).map((l) => {
        const [nome, dep = ''] = l.split(':');
        return {
          nome: nome.trim(),
          dependentes: dep.split(',').map((s) => s.trim()).filter(Boolean),
        };
      });

      const proibidos = linhas(document.getElementById('proibidos').value)
        .map((l) => l.split('-').map((s) => s.trim()))
        .filter((p) => p.length === 2 && p[0] && p[1]);

      try {
        const resp = await fetch('/api/criar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            titulo: document.getElementById('titulo').value,
            pessoas,
            proibidos,
          }),
        });
        const dados = await resp.json();
        if (!resp.ok) {
          saida.className = 'erro';
          saida.textContent = dados.erro;
          return;
        }

        const link = location.origin + dados.link;
        const titulo = document.getElementById('titulo').value.trim();
        gravarLocal([{ titulo, link, criado: Date.now() }, ...lerLocal()]);
        desenharLista();
        saida.textContent = '';

        const box = document.createElement('div');
        box.className = 'box';
        const a = document.createElement('a');
        a.href = link;
        a.textContent = link;
        box.append('Envie este link para os participantes:', document.createElement('br'), a);
        saida.append(box);
      } catch (err) {
        saida.className = 'erro';
        saida.textContent = 'Erro de conexão. Tente de novo.';
      }
    });
  </script>
</body>
</html>
