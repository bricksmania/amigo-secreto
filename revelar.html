<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seu resultado</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    td, th { text-align: left; padding: .6rem; border-bottom: 1px solid #ddd; }
    button { padding: .6rem 1.2rem; font: inherit; cursor: pointer; margin-top: .5rem; }
    input { font: inherit; padding: .5rem; font-size: 1.4rem; letter-spacing: .4rem; width: 9rem; text-align: center; }
    .erro { color: #b00020; }
    small { color: #555; }
    #formulario { margin-top: 1.5rem; }
    #resultado { display: none; }
  </style>
</head>
<body>
  <h1 id="titulo">Seu resultado</h1>
  <p><small>Digite o PIN de 4 dígitos que você criou ao escolher sua unidade.</small></p>

  <div id="formulario">
    <label>PIN<br>
      <input id="pin" inputmode="numeric" autocomplete="off" maxlength="4" type="password">
    </label><br>
    <button id="btnVer">Ver resultado</button>
  </div>

  <p id="msg" class="erro"></p>

  <div id="resultado">
    <div id="res"></div>
  </div>

  <script>
    const token = new URLSearchParams(location.hash.slice(1)).get('t');
    const $ = (id) => document.getElementById(id);
    const msg = $('msg');

    async function ver() {
      msg.textContent = '';
      const pin = $('pin').value.trim();
      $('btnVer').disabled = true;
      const resp = await fetch('/api/revelar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, pin }),
      });
      $('btnVer').disabled = false;
      const dados = await resp.json();
      if (!resp.ok) {
        msg.textContent = dados.erro;
        $('pin').value = '';
        return;
      }

      $('formulario').style.display = 'none';
      $('titulo').textContent = dados.titulo + ' — ' + dados.unidade;

      const tabela = document.createElement('table');
      const cab = document.createElement('tr');
      for (const t of ['Quem', 'Tirou']) {
        const th = document.createElement('th');
        th.textContent = t;
        cab.append(th);
      }
      tabela.append(cab);

      for (const r of dados.resultados) {
        const tr = document.createElement('tr');
        const td1 = document.createElement('td');
        td1.textContent = r.quem;
        const td2 = document.createElement('td');
        td2.textContent = r.tirou;
        tr.append(td1, td2);
        tabela.append(tr);
      }
      $('res').textContent = '';
      $('res').append(tabela);
      $('resultado').style.display = 'block';
    }

    if (!token) {
      msg.textContent = 'Link incompleto.';
      $('formulario').style.display = 'none';
    }
    $('btnVer').addEventListener('click', ver);
    $('pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') ver(); });
  </script>
</body>
</html>
